name: Android CI

on:
  push:
    branches: [ "main", "dev", "feature/**", "codex/**" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify VibeSpace
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        timeout-minutes: 25
        run: ./gradlew testDebugUnitTest

      - name: Enable cross-architecture runtime builds
        uses: docker/setup-qemu-action@v3

      - name: Build bundled Python and Node runtimes
        run: bash .github/scripts/build-bundled-runtime.sh app/build/generated/bundled-runtime

      - name: Run Android Lint
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/vibespace-lint.log"
          set +e
          ./gradlew lintDebug 2>&1 | tee "$log_file"
          lint_status=${PIPESTATUS[0]}
          set -e

          if [[ "$lint_status" -eq 0 ]]; then
            exit 0
          fi

          error_count="$(grep -Eo '[^[:space:]]+:[0-9]+: Error:.*' "$log_file" | sort -u | wc -l | tr -d ' ')"
          if [[ "$error_count" -eq 1 ]] &&
             grep -Fq '[ExpiredTargetSdkVersion]' "$log_file" &&
             grep -Eq 'Lint found 1 errors?, [0-9]+ warnings?' "$log_file"; then
            echo '::warning title=Known target SDK lint::The sole lint error is ExpiredTargetSdkVersion. API 28 is intentionally retained for the documented PRoot execution constraint.'
            exit 0
          fi

          exit "$lint_status"

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Enforce APK size budget
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          size=$(stat -c%s "$apk")
          limit=$((800 * 1024 * 1024))
          echo "Debug APK size: $((size / 1024 / 1024)) MiB"
          test "$size" -le "$limit"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeSpace-v0.1.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 7
